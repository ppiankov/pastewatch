version: 2

updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/vscode-pastewatch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 6+ removes moduleResolution=node10; migrating the extension's
      # tsconfig off moduleResolution:"node" is out of scope for this
      # feature-complete project. Allow 5.x compatibility bumps; defer majors.
      - dependency-name: "typescript"
        versions: [">=6"]
      # @types/vscode must track engines.vscode (^1.125.0), not the latest VS
      # Code release: vsce rejects any build where types > engines minimum
      # ("@types/vscode ^1.134.0 greater than engines.vscode ^1.125.0"). The
      # extension uses only long-stable APIs, so raising the engines floor to
      # match a bumped type would drop older-VS-Code users for no benefit.
      # Bump both deliberately together when the floor actually moves.
      - dependency-name: "@types/vscode"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # setup-swift v3 switched to Swiftly and adds a GPG signature check that
      # fails on the Linux runner; the only fix disables toolchain signature
      # verification, an unacceptable supply-chain downgrade for a security
      # tool. v2 works on every path we use (arm64 uses a container instead).
      - dependency-name: "swift-actions/setup-swift"
        versions: [">=3"]

name: VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - "vscode-pastewatch/**"
  pull_request:
    branches: [main]
    paths:
      - "vscode-pastewatch/**"

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-pastewatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: pastewatch-vsix
          path: vscode-pastewatch/*.vsix

  publish:
    name: Publish to Marketplace
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-pastewatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
